name: CI

on:
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "fish-clicks-api/**"
  push:
    branches: ["develop", "main"]
    paths:
      - "fish-clicks-api/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fish-clicks-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: ./mvnw clean verify